name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - args: ''
          - args: -Ptarget_id=forge-1.20.1
          - args: >-
              -Pbalm_compile_version=21.0.64
              -Pcfbh_compile_version=21.1.24
              -Pfarmers_delight_compile_version=1.3.2
          - args: -Pfull_runtime=true
          - args: >-
              -Ptarget_id=forge-1.20.1
              -Pfull_runtime=true
          - args: >-
              -Ptarget_id=forge-1.20.1
              -Pfull_runtime=true
              -Pcentral_kitchen_runtime=true
              -Pforge_version=47.4.20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup JDK 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2

      - name: Build with Gradle
        run: ./gradlew build ${{ matrix.target.args }}

      - name: Run full-runtime GameTests
        if: contains(matrix.target.args, 'full_runtime=true')
        run: ./gradlew runGameTestServer ${{ matrix.target.args }}
