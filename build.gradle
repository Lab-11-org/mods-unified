plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.91' apply false
    id 'net.neoforged.moddev.legacyforge' version '2.0.91' apply false
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

def targetId = providers.gradleProperty('target_id')
        .orElse("neoforge-${minecraft_version}")
        .get()
if (targetId == 'forge-1.20.1') {
    [
            'minecraft_version', 'minecraft_version_range', 'forge_version',
            'forge_version_range', 'loader_version_range', 'parchment_minecraft_version',
            'parchment_mappings_version', 'java_version', 'use_parchment'
    ].each { name ->
        if (!gradle.startParameter.projectProperties.containsKey(name)) {
            project.extensions.extraProperties.set(name, project.property("forge1201_${name}"))
        }
    }
}
def javaVersion = project.findProperty('java_version')?.toString()?.toInteger() ?: 21
def useParchmentProperty = project.findProperty('use_parchment')
def useParchment = useParchmentProperty == null || useParchmentProperty.toString().toBoolean()
def isForgeTarget = targetId.startsWith('forge-')
def isNeoForgeTarget = targetId.startsWith('neoforge-')

if (isForgeTarget) {
    apply plugin: 'net.neoforged.moddev.legacyforge'
} else if (isNeoForgeTarget) {
    apply plugin: 'net.neoforged.moddev'
} else {
    throw new GradleException("Unsupported target_id '${targetId}'. Expected prefix 'forge-' or 'neoforge-'.")
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

base {
    archivesName = "${mod_id}-${targetId}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(javaVersion)

if (isNeoForgeTarget) {
    neoForge {
        version = project.neo_version

        unitTest {
            enable()
        }

        if (useParchment) {
            parchment {
                mappingsVersion = project.parchment_mappings_version
                minecraftVersion = project.parchment_minecraft_version
            }
        }

        runs {
            client {
                client()
                systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            }

            server {
                server()
                programArgument '--nogui'
                systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            }

            gameTestServer {
                type = 'gameTestServer'
                systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            }

            data {
                data()
                programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
            }

            configureEach {
                systemProperty 'forge.logging.markers', 'REGISTRIES'
                logLevel = org.slf4j.event.Level.DEBUG
            }
        }

        mods {
            "${mod_id}" {
                sourceSet(sourceSets.main)
            }
        }
    }
}

if (isForgeTarget) {
    legacyForge {
        version = project.minecraft_version + '-' + project.forge_version

        if (useParchment) {
            parchment {
                mappingsVersion = project.parchment_mappings_version
                minecraftVersion = project.parchment_minecraft_version
            }
        }

        runs {
            client {
                client()
                systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
            }

            server {
                server()
                programArgument '--nogui'
                systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
            }

            gameTestServer {
                type = 'gameTestServer'
                systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
            }

            data {
                data()
                programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
            }

            configureEach {
                systemProperty 'forge.logging.markers', 'REGISTRIES'
                logLevel = org.slf4j.event.Level.DEBUG
            }
        }

        mods {
            "${mod_id}" {
                sourceSet(sourceSets.main)
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }
def targetSpecificJavaDir = "src/impl/${targetId}/java"
if (file(targetSpecificJavaDir).exists()) {
    sourceSets.main.java.srcDir targetSpecificJavaDir
}
def targetSpecificResourcesDir = "src/impl/${targetId}/resources"
if (file(targetSpecificResourcesDir).exists()) {
    sourceSets.main.resources.srcDir targetSpecificResourcesDir
}
def targetSpecificTestJavaDir = "src/impl/${targetId}/test"
if (file(targetSpecificTestJavaDir).exists()) {
    sourceSets.test.java.srcDir targetSpecificTestJavaDir
}

if (isForgeTarget) {
    final List<String> mainOverridePaths = [
            '/src/main/java/org/lab_11/modsunified/Unifiled.java',
            '/src/main/java/org/lab_11/modsunified/impl/cookingforblockheads/CookingPotContainerTooltipBridge.java',
            '/src/main/java/org/lab_11/modsunified/impl/cookingforblockheads/CookingPotProcessorCapability.java',
            '/src/main/java/org/lab_11/modsunified/impl/cookingforblockheads/CookingPotKitchenHandler.java',
            '/src/main/java/org/lab_11/modsunified/impl/cookingforblockheads/CustomizeBlocks.java',
            '/src/main/java/org/lab_11/modsunified/impl/cookingforblockheads/BalmFallbackProviderBridge.java',
            '/src/main/java/org/lab_11/modsunified/impl/cookingforblockheads/client/DungeonOvenClientHooks.java',
            '/src/main/java/org/lab_11/modsunified/impl/cookingforblockheads/client/LavaSinkRenderer.java',
            '/src/main/java/org/lab_11/modsunified/mixin/cookingforblockheads/EnamelBasinBlockMixin.java',
            '/src/main/java/org/lab_11/modsunified/mixin/cookingforblockheads/KaleidoscopePotBlockMixin.java',
            '/src/main/java/org/lab_11/modsunified/mixin/cookingforblockheads/OvenRendererMixin.java',
            '/src/main/java/org/lab_11/modsunified/impl/cookingforblockheads/CookingPotIndexedRecipe.java'
    ]
    sourceSets.main.java.exclude { details ->
        final String normalizedPath = details.file.absolutePath.replace('\\', '/')
        return mainOverridePaths.any { normalizedPath.endsWith(it) }
    }
    sourceSets.main.resources.exclude { details ->
        details.file.absolutePath.replace('\\', '/').endsWith(
                '/src/main/resources/lab_11_mods_unified.mixins.json')
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

if (isForgeTarget) {
    obfuscation {
        createRemappingConfiguration(configurations.localRuntime)
    }
}

if (targetId == 'neoforge-1.21.1') {
    def balmCompileVersion = providers.gradleProperty('balm_compile_version').getOrElse(balm_version)
    def cfbhCompileVersion = providers.gradleProperty('cfbh_compile_version').getOrElse(cfbh_version)
    def farmersDelightCompileVersion = providers.gradleProperty('farmers_delight_compile_version').getOrElse(farmersdelight_version)

    dependencies {
        localRuntime "maven.modrinth:balm:${balmCompileVersion}+neoforge-${minecraft_version}"
        localRuntime "maven.modrinth:cooking-for-blockheads:${cfbhCompileVersion}+neoforge-${minecraft_version}"
        localRuntime "maven.modrinth:farmers-delight:${minecraft_version}-${farmersDelightCompileVersion}"
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def defaultPackFormat = '34'
    if (targetId == 'forge-1.20.1') {
        defaultPackFormat = '15'
    }

    var replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            loader_version_range    : loader_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_authors             : mod_authors,
            mod_description         : mod_description,
            mod_homepage            : mod_homepage,
            mod_issues              : mod_issues,
            mod_logo_file           : mod_logo_file,
            pack_format             : providers.gradleProperty('pack_format').orElse(defaultPackFormat).get()
    ]

    from('src/main/templates/pack.mcmeta')

    if (isNeoForgeTarget) {
        replaceProperties.putAll([
                neo_version: neo_version
        ])
        from('src/main/templates/META-INF/neoforge.mods.toml') {
            into 'META-INF'
        }
    }

    if (isForgeTarget) {
        replaceProperties.putAll([
                forge_version      : forge_version,
                forge_version_range: forge_version_range
        ])
        from('src/main/templates/META-INF/mods.toml') {
            into 'META-INF'
        }
    }

    inputs.properties replaceProperties
    expand replaceProperties
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
if (isNeoForgeTarget) {
    neoForge.ideSyncTask generateModMetadata
}
if (isForgeTarget) {
    legacyForge.ideSyncTask generateModMetadata
}

if (isForgeTarget) {
    tasks.named('jar', Jar).configure {
        manifest {
            attributes(
                    'MixinConfigs': "${mod_id}.mixins.json"
            )
        }
    }
}

tasks.register('multiPotSelectionCheck', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.lab_11.modsunified.impl.cookingforblockheads.MultiPotSelectionCheck'
}
tasks.register('optionalDependencyMixinCheck', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.lab_11.modsunified.mixin.OptionalDependencyMixinPluginCheck'
}
if (targetId == 'neoforge-1.21.1') {
    tasks.register('indexedRecipeLookupCheck', JavaExec) {
        dependsOn tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath
        mainClass = 'org.lab_11.modsunified.impl.cookingforblockheads.IndexedRecipeLookupCheck'
    }
}
if (targetId == 'forge-1.20.1') {
    tasks.register('legacyKitchenProviderCheck', JavaExec) {
        dependsOn tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath
        mainClass = 'org.lab_11.modsunified.impl.cookingforblockheads.LegacyKitchenProviderCheck'
    }
}
tasks.named('check') {
    dependsOn tasks.named('multiPotSelectionCheck'), tasks.named('optionalDependencyMixinCheck')
    if (targetId == 'neoforge-1.21.1') {
        dependsOn tasks.named('indexedRecipeLookupCheck')
    }
    if (targetId == 'forge-1.20.1') {
        dependsOn tasks.named('legacyKitchenProviderCheck')
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
