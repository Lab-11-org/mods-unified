plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.91' apply false
    id 'net.neoforged.moddev.legacyforge' version '2.0.91' apply false
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

def targetId = providers.gradleProperty('target_id')
        .orElse("neoforge-${minecraft_version}")
        .get()
def javaVersion = providers.gradleProperty('java_version').orElse('21').get().toInteger()
def useParchment = providers.gradleProperty('use_parchment').orElse('true').get().toBoolean()
def isForgeTarget = targetId.startsWith('forge-')
def isNeoForgeTarget = targetId.startsWith('neoforge-')

if (isForgeTarget) {
    apply plugin: 'net.neoforged.moddev.legacyforge'
} else if (isNeoForgeTarget) {
    apply plugin: 'net.neoforged.moddev'
} else {
    throw new GradleException("Unsupported target_id '${targetId}'. Expected prefix 'forge-' or 'neoforge-'.")
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven {
        name = 'Twelve Iterations'
        url = 'https://maven.twelveiterations.com/releases'
        content {
            includeGroup 'net.blay09.mods'
        }
    }
}

base {
    archivesName = "${mod_id}-${targetId}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(javaVersion)

if (isNeoForgeTarget) {
    neoForge {
        version = project.neo_version

        if (useParchment) {
            parchment {
                mappingsVersion = project.parchment_mappings_version
                minecraftVersion = project.parchment_minecraft_version
            }
        }

        runs {
            client {
                client()
                systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            }

            server {
                server()
                programArgument '--nogui'
                systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            }

            gameTestServer {
                type = 'gameTestServer'
                systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            }

            data {
                data()
                programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
            }

            configureEach {
                systemProperty 'forge.logging.markers', 'REGISTRIES'
                logLevel = org.slf4j.event.Level.DEBUG
            }
        }

        mods {
            "${mod_id}" {
                sourceSet(sourceSets.main)
            }
        }
    }
}

if (isForgeTarget) {
    legacyForge {
        version = project.minecraft_version + '-' + project.forge_version

        if (useParchment) {
            parchment {
                mappingsVersion = project.parchment_mappings_version
                minecraftVersion = project.parchment_minecraft_version
            }
        }

        runs {
            client {
                client()
                systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
            }

            server {
                server()
                programArgument '--nogui'
                systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
            }

            gameTestServer {
                type = 'gameTestServer'
                systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
            }

            data {
                data()
                programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
            }

            configureEach {
                systemProperty 'forge.logging.markers', 'REGISTRIES'
                logLevel = org.slf4j.event.Level.DEBUG
            }
        }

        mods {
            "${mod_id}" {
                sourceSet(sourceSets.main)
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }
def targetSpecificJavaDir = "src/impl/${targetId}/java"
if (file(targetSpecificJavaDir).exists()) {
    sourceSets.main.java.srcDir targetSpecificJavaDir
}

if (isForgeTarget) {
    final List<String> mainOverridePaths = [
            '/src/main/java/org/lab_11/modsunified/Unifiled.java',
            '/src/main/java/org/lab_11/modsunified/impl/cookingforblockheads/CookingPotContainerTooltipBridge.java',
            '/src/main/java/org/lab_11/modsunified/impl/cookingforblockheads/CookingPotProcessorCapability.java',
            '/src/main/java/org/lab_11/modsunified/impl/cookingforblockheads/DungeonOvenCompat.java',
            '/src/main/java/org/lab_11/modsunified/impl/cookingforblockheads/client/DungeonOvenClientHooks.java',
            '/src/main/java/org/lab_11/modsunified/impl/cookingforblockheads/CookingPotIndexedRecipe.java'
    ]
    sourceSets.main.java.exclude { details ->
        final String normalizedPath = details.file.absolutePath.replace('\\', '/')
        return mainOverridePaths.any { normalizedPath.endsWith(it) }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

if (isForgeTarget) {
    obfuscation {
        createRemappingConfiguration(configurations.localRuntime)
    }
}

def defaultOptionalLoaderPlatform = isForgeTarget ? 'forge' : 'neoforge'
def optionalLoaderPlatform = providers.gradleProperty('optional_loader_platform').orElse(defaultOptionalLoaderPlatform).get()
def optionalModsSearchDirsProperty = providers.gradleProperty('optional_mods_dirs').orNull
def optionalModsSearchDirsEnv = providers.environmentVariable('LAB11_MODS_DIRS').orNull

def currentMinecraftVersion = providers.gradleProperty('minecraft_version').orElse('1.21.1').get()
def currentNeoVersion = providers.gradleProperty('neo_version').orElse('21.1.219').get()
def currentForgeVersion = providers.gradleProperty('forge_version').orElse('0.0.0').get()
def defaultVersionDirName = isForgeTarget
        ? "${currentMinecraftVersion}-Forge_${currentForgeVersion}"
        : "${currentMinecraftVersion}-NeoForge_${currentNeoVersion}"

def defaultOptionalModsSearchDirs = [
        "${System.getProperty('user.home')}/.minecraft/versions/${defaultVersionDirName}/mods",
        "${System.getProperty('user.home')}/.minecraft/versions/modpack/mods",
        "${System.getProperty('user.home')}/.minecraft/mods"
]

def optionalModsSearchDirs = optionalModsSearchDirsProperty != null && !optionalModsSearchDirsProperty.trim().isEmpty()
        ? optionalModsSearchDirsProperty
        : optionalModsSearchDirsEnv != null && !optionalModsSearchDirsEnv.trim().isEmpty()
            ? optionalModsSearchDirsEnv
            : defaultOptionalModsSearchDirs.join(',')

def findOptionalModJar = { String logicalName, List<String> includePatterns ->
    final List<File> searchRoots = optionalModsSearchDirs
            .split(',')
            .collect { it.trim() }
            .findAll { !it.isEmpty() }
            .collect { file(it) }
            .findAll { it.exists() && it.isDirectory() }

    if (searchRoots.isEmpty()) {
        logger.lifecycle(
                "No optional mod search directories exist; skipping {} runtime injection. Checked: '{}'.",
                logicalName,
                optionalModsSearchDirs
        )
        return null
    }

    final Set<File> matches = new LinkedHashSet<>()
    for (final File searchRoot : searchRoots) {
        for (final String includePattern : includePatterns) {
            matches.addAll(fileTree(dir: searchRoot, include: [includePattern]).files)
        }
    }

    if (matches.isEmpty()) {
        logger.lifecycle(
                "No matching optional dependency found for {}. Searched: {} with patterns {}.",
                logicalName,
                searchRoots*.absolutePath,
                includePatterns
        )
        return null
    }

    final List<File> orderedMatches = matches.toList().sort { left, right ->
        final int byModifiedTime = Long.compare(left.lastModified(), right.lastModified())
        if (byModifiedTime != 0) {
            return byModifiedTime
        }
        return left.name <=> right.name
    }
    final File selected = orderedMatches.last()
    logger.lifecycle("Resolved optional dependency '{}' to '{}'.", logicalName, selected.absolutePath)
    if (orderedMatches.size() > 1) {
        logger.lifecycle("Resolved optional dependency '{}' to '{}' from {} candidates.",
                logicalName, selected.name, orderedMatches.size())
    }
    return selected
}

def balmJar = findOptionalModJar('Balm', [
        "balm-${optionalLoaderPlatform}-${balm_minecraft_version}-*.jar",
        "balm-${optionalLoaderPlatform}-${minecraft_version}-*.jar",
        "balm-${optionalLoaderPlatform}-*.jar"
])
def cookingForBlockheadsJar = findOptionalModJar('CookingForBlockheads', [
        "cookingforblockheads-${optionalLoaderPlatform}-${minecraft_version}-*.jar",
        "cookingforblockheads-${optionalLoaderPlatform}-*.jar"
])
def farmersDelightJar = findOptionalModJar('FarmersDelight', [
        "FarmersDelight-${minecraft_version}-*.jar",
        "farmersdelight-${minecraft_version}-*.jar",
        "FarmersDelight-*.jar",
        "farmersdelight-*.jar"
])

dependencies {
    if (balmJar != null) {
        localRuntime files(balmJar)
    }
    if (cookingForBlockheadsJar != null) {
        localRuntime files(cookingForBlockheadsJar)
    }
    if (farmersDelightJar != null) {
        localRuntime files(farmersDelightJar)
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def defaultPackFormat = '34'
    if (targetId == 'forge-1.20.1') {
        defaultPackFormat = '15'
    } else if (targetId == 'neoforge-20.x') {
        defaultPackFormat = '22'
    }

    var replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            loader_version_range    : loader_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_authors             : mod_authors,
            mod_description         : mod_description,
            mod_homepage            : mod_homepage,
            mod_issues              : mod_issues,
            mod_logo_file           : mod_logo_file,
            pack_format             : providers.gradleProperty('pack_format').orElse(defaultPackFormat).get()
    ]

    from('src/main/templates/pack.mcmeta')

    if (isNeoForgeTarget) {
        replaceProperties.putAll([
                neo_version: neo_version
        ])
        from('src/main/templates/META-INF/neoforge.mods.toml') {
            into 'META-INF'
        }
    }

    if (isForgeTarget) {
        replaceProperties.putAll([
                forge_version      : forge_version,
                forge_version_range: forge_version_range
        ])
        from('src/main/templates/META-INF/mods.toml') {
            into 'META-INF'
        }
    }

    inputs.properties replaceProperties
    expand replaceProperties
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
if (isNeoForgeTarget) {
    neoForge.ideSyncTask generateModMetadata
}
if (isForgeTarget) {
    legacyForge.ideSyncTask generateModMetadata
}

if (isForgeTarget) {
    tasks.named('jar', Jar).configure {
        manifest {
            attributes(
                    'MixinConfigs': "${mod_id}.mixins.json"
            )
        }
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

