org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# CFW proxy defaults for dependency/networked Gradle operations.
systemProp.http.proxyHost=10.0.2.5
systemProp.http.proxyPort=6152
systemProp.https.proxyHost=10.0.2.5
systemProp.https.proxyPort=6152
systemProp.http.nonProxyHosts=localhost|127.0.0.1|::1|10.0.2.1|10.0.2.5|10.0.2.11
systemProp.https.nonProxyHosts=localhost|127.0.0.1|::1|10.0.2.1|10.0.2.5|10.0.2.11

# Parchment
parchment_minecraft_version=1.21
parchment_mappings_version=2024.07.28

# Environment Properties
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.219
loader_version_range=[4,)

# Mod Properties
mod_id=lab_11_mods_unified
mod_name=Code Monad's Mods Unified
mod_license=MIT
mod_version=0.1.3
mod_group_id=org.lab_11.modsunified
mod_authors=Code Monad
mod_description=Code Monad's compatibility integration bridge for many mods.
mod_homepage=https://github.com/Lab-11-org/mods-unified
mod_issues=https://github.com/Lab-11-org/mods-unified/issues
mod_logo_file=code.png

# Optional libraries
optional_loader_platform=neoforge
# optional_mods_dirs can be set with:
# -Poptional_mods_dirs=/path/to/mods1,/path/to/mods2
# or env:
# LAB11_MODS_DIRS=/path/to/mods1,/path/to/mods2

balm_minecraft_version=1.21.1
balm_version=21.0.56
cfbh_version=21.1.17
farmersdelight_version=1.2.9

# Target profiles:
# - buildNeoForge211 (default line)
# - buildNeoForge20x (wider NeoForge 20.x support)
# - buildForge1201 (Forge 1.20.1 support)

neo20_minecraft_version=1.20.4
neo20_minecraft_version_range=[1.20.4,1.21)
neo20_version=20.4.251
neo20_loader_version_range=[1,)
neo20_parchment_minecraft_version=1.20.4
neo20_parchment_mappings_version=2024.04.14
neo20_java_version=21
# NeoForge 20.x + Java 21 may be unstable with JST parchment transforms on some hosts.
neo20_use_parchment=false

forge1201_minecraft_version=1.20.1
forge1201_minecraft_version_range=[1.20.1,1.21)
forge1201_forge_version=47.4.0
forge1201_forge_version_range=[47,)
forge1201_loader_version_range=[47,)
forge1201_parchment_minecraft_version=1.20.1
forge1201_parchment_mappings_version=2023.09.03
forge1201_java_version=17
forge1201_use_parchment=true
