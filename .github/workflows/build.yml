name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dependencies:
          - balm: 21.0.56
            cooking_for_blockheads: 21.1.17
            farmers_delight: 1.2.9
          - balm: 21.0.64
            cooking_for_blockheads: 21.1.24
            farmers_delight: 1.3.2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: >-
          ./gradlew build
          -Pbalm_compile_version=${{ matrix.dependencies.balm }}
          -Pcfbh_compile_version=${{ matrix.dependencies.cooking_for_blockheads }}
          -Pfarmers_delight_compile_version=${{ matrix.dependencies.farmers_delight }}
