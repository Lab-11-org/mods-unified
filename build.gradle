        target_id                  : 'neoforge-1.21.1',
        minecraft_version          : providers.gradleProperty('minecraft_version').orElse('1.21.1').get(),
        minecraft_version_range    : providers.gradleProperty('minecraft_version_range').orElse('[1.21.1,1.22)').get(),
        neo_version                : providers.gradleProperty('neo_version').orElse('21.1.219').get(),
        loader_version_range       : providers.gradleProperty('loader_version_range').orElse('[4,)').get(),
        parchment_minecraft_version: providers.gradleProperty('parchment_minecraft_version').orElse('1.21').get(),
        parchment_mappings_version : providers.gradleProperty('parchment_mappings_version').orElse('2024.07.28').get(),
        java_version               : '21',
        use_parchment              : 'true'
]

