plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.140'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    def balmCompileVersion = providers.gradleProperty('balm_compile_version').getOrElse(balm_version)
    def cookingForBlockheadsCompileVersion = providers.gradleProperty('cooking_for_blockheads_compile_version').getOrElse(cooking_for_blockheads_version)
    def farmersDelightCompileVersion = providers.gradleProperty('farmers_delight_compile_version').getOrElse(farmers_delight_version)

    compileOnly "maven.modrinth:balm:${balmCompileVersion}+neoforge-${minecraft_version}"
    compileOnly "maven.modrinth:cooking-for-blockheads:${cookingForBlockheadsCompileVersion}+neoforge-${minecraft_version}"
    compileOnly "maven.modrinth:farmers-delight:${minecraft_version}-${farmersDelightCompileVersion}"

    localRuntime "maven.modrinth:balm:${balmCompileVersion}+neoforge-${minecraft_version}"
    localRuntime "maven.modrinth:cooking-for-blockheads:${cookingForBlockheadsCompileVersion}+neoforge-${minecraft_version}"
    localRuntime "maven.modrinth:farmers-delight:${minecraft_version}-${farmersDelightCompileVersion}"
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            mod_homepage           : mod_homepage,
            mod_issues             : mod_issues,
            mod_logo_file          : mod_logo_file,
            cooking_for_blockheads_version: cooking_for_blockheads_version,
            farmers_delight_version: farmers_delight_version,
            balm_version           : balm_version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
