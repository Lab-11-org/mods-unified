name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          git rev-parse --verify "refs/tags/$tag"
          git checkout --detach "$tag"
          version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          [[ "$tag" == "v$version" ]]
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup JDK 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2

      - name: Build release jars
        env:
          RELEASE_DIR: ${{ runner.temp }}/release
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir -p "$RELEASE_DIR"
          ./gradlew clean build -Pfull_runtime=true
          cp "build/libs/lab_11_mods_unified-neoforge-1.21.1-$VERSION.jar" "$RELEASE_DIR/"
          ./gradlew runGameTestServer -Pfull_runtime=true
          ./gradlew clean check -Pbalm_compile_version=21.0.64 -Pcfbh_compile_version=21.1.24 -Pfarmers_delight_compile_version=1.3.2
          ./gradlew clean build -Ptarget_id=forge-1.20.1 -Pfull_runtime=true
          cp "build/libs/lab_11_mods_unified-forge-1.20.1-$VERSION.jar" "$RELEASE_DIR/"
          ./gradlew runGameTestServer -Ptarget_id=forge-1.20.1 -Pfull_runtime=true
          ./gradlew runGameTestServer -Ptarget_id=forge-1.20.1 -Pfull_runtime=true -Pcentral_kitchen_runtime=true -Pforge_version=47.4.20

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          FORGE_JAR: ${{ runner.temp }}/release/lab_11_mods_unified-forge-1.20.1-${{ steps.release.outputs.version }}.jar
          NEOFORGE_JAR: ${{ runner.temp }}/release/lab_11_mods_unified-neoforge-1.21.1-${{ steps.release.outputs.version }}.jar
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$FORGE_JAR" "$NEOFORGE_JAR" --clobber
          else
            gh release create "$RELEASE_TAG" "$FORGE_JAR" "$NEOFORGE_JAR" --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
