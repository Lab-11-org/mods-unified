modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="${mod_issues}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="${mod_homepage}"
logoFile="${mod_logo_file}"
logoBlur=false
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="cookingforblockheads"
type="optional"
versionRange="[21.1.17,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="farmersdelight"
type="optional"
versionRange="[1.2.9,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="balm"
type="optional"
versionRange="[21.0.56,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="dungeonsdelight"
type="optional"
versionRange="[1.4.5,)"
ordering="AFTER"
side="BOTH"

[[mixins]]
config="${mod_id}.mixins.json"
