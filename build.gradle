plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.91' apply false
    id 'net.neoforged.moddev.legacyforge' version '2.0.91' apply false
    id 'idea'
}

version = mod_version
group = mod_group_id

def targetId = providers.gradleProperty('target_id')
        .orElse('neoforge-1.21.1')
        .get()
if (!(targetId in ['neoforge-1.21.1', 'forge-1.20.1'])) {
    throw new GradleException("Unsupported target_id '${targetId}'. Expected 'neoforge-1.21.1' or 'forge-1.20.1'.")
}
if (targetId == 'forge-1.20.1') {
    [
            'minecraft_version', 'minecraft_version_range', 'forge_version',
            'forge_version_range', 'loader_version_range', 'parchment_minecraft_version',
            'parchment_mappings_version', 'java_version', 'use_parchment'
    ].each { name ->
        if (!gradle.startParameter.projectProperties.containsKey(name)) {
            project.extensions.extraProperties.set(name, project.property("forge1201_${name}"))
        }
    }
}
def javaVersion = project.findProperty('java_version')?.toString()?.toInteger() ?: 21
def useParchmentProperty = project.findProperty('use_parchment')
def useParchment = useParchmentProperty == null || useParchmentProperty.toString().toBoolean()
def isForgeTarget = targetId == 'forge-1.20.1'
def isNeoForgeTarget = targetId == 'neoforge-1.21.1'
def fullRuntime = providers.gradleProperty('full_runtime')
        .map { it.toBoolean() }
        .getOrElse(false)

if (isForgeTarget) {
    apply plugin: 'net.neoforged.moddev.legacyforge'
} else {
    apply plugin: 'net.neoforged.moddev'
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

base {
    archivesName = "${mod_id}-${targetId}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(javaVersion)

if (isNeoForgeTarget) {
    neoForge {
        version = project.neo_version

        unitTest {
            enable()
        }

        if (useParchment) {
            parchment {
                mappingsVersion = project.parchment_mappings_version
                minecraftVersion = project.parchment_minecraft_version
            }
        }

        runs {
            client {
                client()
                systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            }

            server {
                server()
                programArgument '--nogui'
                systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            }

            gameTestServer {
                type = 'gameTestServer'
                gameDirectory = layout.projectDirectory.dir("run/gametest-${targetId}")
                systemProperty 'neoforge.enabledGameTestNamespaces', "${project.mod_id},minecraft"
                systemProperty 'lab11.fullRuntime', fullRuntime.toString()
            }

            data {
                data()
                programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
            }

            configureEach {
                systemProperty 'forge.logging.markers', 'REGISTRIES'
                logLevel = org.slf4j.event.Level.DEBUG
            }
        }

        mods {
            "${mod_id}" {
                sourceSet(sourceSets.main)
            }
        }
    }
}

if (isForgeTarget) {
    legacyForge {
        version = project.minecraft_version + '-' + project.forge_version

        if (useParchment) {
            parchment {
                mappingsVersion = project.parchment_mappings_version
                minecraftVersion = project.parchment_minecraft_version
            }
        }

        runs {
            client {
                client()
                systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
            }

            server {
                server()
                programArgument '--nogui'
                systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
            }

            gameTestServer {
                type = 'gameTestServer'
                gameDirectory = layout.projectDirectory.dir("run/gametest-${targetId}")
                systemProperty 'forge.enabledGameTestNamespaces', "${project.mod_id},minecraft"
                systemProperty 'lab11.fullRuntime', fullRuntime.toString()
            }

            data {
                data()
                programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
            }

            configureEach {
                programArguments.addAll '--mixin', "${project.mod_id}.mixins.json"
                systemProperty 'forge.logging.markers', 'REGISTRIES'
                logLevel = org.slf4j.event.Level.DEBUG
            }
        }

        mods {
            "${mod_id}" {
                sourceSet(sourceSets.main)
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }
sourceSets.main.java.srcDir "src/impl/${targetId}/java"
sourceSets.main.resources.srcDir "src/impl/${targetId}/resources"
sourceSets.test.java.srcDir "src/impl/${targetId}/test"

if (isForgeTarget) {
    final List<String> mainOverridePaths = [
            '/src/main/java/org/lab_11/modsunified/Unifiled.java',
            '/src/main/java/org/lab_11/modsunified/impl/cookingforblockheads/CookingPotContainerTooltipBridge.java',
            '/src/main/java/org/lab_11/modsunified/impl/cookingforblockheads/CookingPotProcessorCapability.java',
            '/src/main/java/org/lab_11/modsunified/impl/cookingforblockheads/CookingPotKitchenHandler.java',
            '/src/main/java/org/lab_11/modsunified/impl/cookingforblockheads/CustomizeBlocks.java',
            '/src/main/java/org/lab_11/modsunified/impl/cookingforblockheads/BalmFallbackProviderBridge.java',
            '/src/main/java/org/lab_11/modsunified/impl/cookingforblockheads/client/DungeonOvenClientHooks.java',
            '/src/main/java/org/lab_11/modsunified/impl/cookingforblockheads/client/LavaSinkRenderer.java',
            '/src/main/java/org/lab_11/modsunified/mixin/cookingforblockheads/EnamelBasinBlockMixin.java',
            '/src/main/java/org/lab_11/modsunified/mixin/cookingforblockheads/KaleidoscopePotBlockMixin.java',
            '/src/main/java/org/lab_11/modsunified/mixin/cookingforblockheads/OvenRendererMixin.java'
    ]
    sourceSets.main.java.exclude { details ->
        final String normalizedPath = details.file.absolutePath.replace('\\', '/')
        return mainOverridePaths.any { normalizedPath.endsWith(it) }
    }
    sourceSets.main.resources.exclude { details ->
        details.file.absolutePath.replace('\\', '/').endsWith(
                '/src/main/resources/lab_11_mods_unified.mixins.json')
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

if (isForgeTarget) {
    obfuscation {
        createRemappingConfiguration(configurations.localRuntime)
    }
}

if (fullRuntime) {
    dependencies {
        if (isNeoForgeTarget) {
            localRuntime 'maven.modrinth:MBAkmtvl:KgypwTqX' // Balm 21.0.65
            localRuntime 'maven.modrinth:vJnhuDde:MQCIy6VF' // Cooking for Blockheads 21.1.24
            localRuntime 'maven.modrinth:R2OftAxM:wpkbWnVh' // Farmer's Delight 1.3.3
            localRuntime 'maven.modrinth:qPfNr476:aFluEQDH' // Dungeon's Delight 1.5.0
            localRuntime 'maven.modrinth:mk0Htq87:tk5EQpUG' // RunicLib 5.0.7
            localRuntime 'maven.modrinth:v17FatAc:TqaHu4Ma' // Kaleidoscope Cookery 1.4.1
        } else {
            modLocalRuntime 'maven.modrinth:MBAkmtvl:PtvPxXii' // Balm 7.3.42
            modLocalRuntime 'maven.modrinth:vJnhuDde:W87tG8sG' // Cooking for Blockheads 16.0.15
            modLocalRuntime 'maven.modrinth:R2OftAxM:UiX0eEUW' // Farmer's Delight 1.3.3
            modLocalRuntime 'maven.modrinth:qPfNr476:Ick1jUCc' // Dungeon's Delight 1.3.0
            modLocalRuntime 'maven.modrinth:mk0Htq87:DyyjKTPx' // RunicLib 4.3.11
            modLocalRuntime 'maven.modrinth:qMxbM4BQ:p0INUam7' // Miner's Delight 1.4.5 backport
            modLocalRuntime 'maven.modrinth:v17FatAc:NXvhd04p' // Kaleidoscope Cookery 1.4.1
        }
    }
} else if (isNeoForgeTarget) {
    def balmCompileVersion = providers.gradleProperty('balm_compile_version').getOrElse(balm_version)
    def cfbhCompileVersion = providers.gradleProperty('cfbh_compile_version').getOrElse(cfbh_version)
    def farmersDelightCompileVersion = providers.gradleProperty('farmers_delight_compile_version').getOrElse(farmersdelight_version)

    dependencies {
        localRuntime "maven.modrinth:balm:${balmCompileVersion}+neoforge-${minecraft_version}"
        localRuntime "maven.modrinth:cooking-for-blockheads:${cfbhCompileVersion}+neoforge-${minecraft_version}"
        localRuntime "maven.modrinth:farmers-delight:${minecraft_version}-${farmersDelightCompileVersion}"
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def defaultPackFormat = '34'
    if (targetId == 'forge-1.20.1') {
        defaultPackFormat = '15'
    }

    var replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            loader_version_range    : loader_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_authors             : mod_authors,
            mod_description         : mod_description,
            mod_homepage            : mod_homepage,
            mod_issues              : mod_issues,
            mod_logo_file           : mod_logo_file,
            pack_format             : providers.gradleProperty('pack_format').orElse(defaultPackFormat).get()
    ]

    from('src/main/templates/pack.mcmeta')

    if (isNeoForgeTarget) {
        replaceProperties.putAll([
                neo_version      : neo_version,
                neo_version_range: neo_version_range
        ])
        from('src/main/templates/META-INF/neoforge.mods.toml') {
            into 'META-INF'
        }
    }

    if (isForgeTarget) {
        replaceProperties.putAll([
                forge_version      : forge_version,
                forge_version_range: forge_version_range
        ])
        from('src/main/templates/META-INF/mods.toml') {
            into 'META-INF'
        }
    }

    from('LICENSE') {
        into 'META-INF'
    }

    inputs.properties replaceProperties
    expand replaceProperties
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
if (isNeoForgeTarget) {
    neoForge.ideSyncTask generateModMetadata
}
if (isForgeTarget) {
    legacyForge.ideSyncTask generateModMetadata
}

if (isForgeTarget) {
    tasks.named('jar', Jar).configure {
        manifest {
            attributes(
                    'MixinConfigs': "${mod_id}.mixins.json"
            )
        }
    }
}

def smokeChecks = [
        multiPotSelectionCheck      : [null, 'org.lab_11.modsunified.impl.cookingforblockheads.MultiPotSelectionCheck'],
        bridgeCatalogCheck          : [null, 'org.lab_11.modsunified.impl.cookingforblockheads.BridgeCatalogCheck'],
        optionalDependencyMixinCheck: [null, 'org.lab_11.modsunified.mixin.OptionalDependencyMixinPluginCheck'],
        indexedRecipeLookupCheck    : ['neoforge-1.21.1', 'org.lab_11.modsunified.impl.cookingforblockheads.IndexedRecipeLookupCheck'],
        legacyKitchenProviderCheck  : ['forge-1.20.1', 'org.lab_11.modsunified.impl.cookingforblockheads.LegacyKitchenProviderCheck'],
        forgeKaleidoscopeCookwareCheck: ['forge-1.20.1', 'org.lab_11.modsunified.impl.cookingforblockheads.ForgeKaleidoscopeCookwareCheck'],
        versionContractCheck        : [null, 'org.lab_11.modsunified.impl.cookingforblockheads.VersionContractCheck']
].findAll { name, check -> check[0] == null || check[0] == targetId }
smokeChecks.each { name, check ->
    tasks.register(name, JavaExec) {
        dependsOn tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath + sourceSets.main.runtimeClasspath + sourceSets.main.compileClasspath
        mainClass = check[1]
    }
}
tasks.named('check') {
    dependsOn smokeChecks.keySet()
}

tasks.withType(JavaCompile).configureEach {
    inputs.property('target_id', targetId)
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Reproduce issue #5 with the exact reported optional-mod combination.
if (providers.gradleProperty('central_kitchen_runtime').map { it.toBoolean() }.getOrElse(false)) {
    if (!isForgeTarget || !fullRuntime) {
        throw new GradleException('central_kitchen_runtime requires Forge and full_runtime=true')
    }
    configurations.configureEach {
        resolutionStrategy.force 'maven.modrinth:R2OftAxM:SiIpcZzM'
    }
    dependencies {
        modLocalRuntime 'maven.modrinth:LNytGWDc:8amzvn9x' // Create 6.0.8
        modLocalRuntime 'maven.modrinth:btq68HMO:jMB94kRJ' // Central Kitchen 1.5.1
    }
    legacyForge.runs.gameTestServer.systemProperty 'lab11.centralKitchenRuntime', 'true'
}
